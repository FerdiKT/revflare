name: Bug report
description: Something does not work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please do not paste App Store Connect / In-App Purchase keys, RevenueCat keys, Revflare API keys or device tokens, notification URLs, or real revenue and customer data.
        Security problems: report them privately via the Security tab instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Apps
        2. Import from App Store Connect
        3. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - App Store notifications / Apple sync
        - Imports (Apple history, RevenueCat, Sales reports)
        - Metrics, charts, cohorts, forecast
        - Web app
        - iOS app, widgets, push
        - RevflareKit / Apple Ads attribution
        - Workspaces, users and roles / Admin
        - REST API / MCP
        - CLI (revflare)
        - Deploy / configuration / Free plan limits
        - Other
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error message
      description: From the web app, the CLI, Admin → Overview or the Worker logs (remove ids, keys and tokens).
      render: text
  - type: input
    id: version
    attributes:
      label: Revflare version
      description: GET /api/v1/version (or Admin → Overview), or the commit you deployed.
