version: 2
updates:
  - package-ecosystem: npm
    directories: ["/", "/cli"]
    schedule:
      interval: weekly
    # Minor and patch updates arrive as one weekly PR; majors are upgraded by hand.
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
